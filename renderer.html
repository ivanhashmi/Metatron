<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metatron</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        color: rgba(244, 246, 250, 0.94);
        -webkit-font-smoothing: antialiased;
      }

      .overlay {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: rgba(16, 18, 24, 0.86);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        overflow: hidden;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-app-region: drag;
        user-select: none;
        flex-shrink: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #5eead4;
        transition: background 0.15s ease;
      }

      .status-dot.streaming {
        background: #60a5fa;
        animation: pulse 1s infinite ease-in-out;
      }

      .status-dot.error {
        background: #f87171;
      }

      .listen-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(203, 213, 225, 0.78);
        font-size: 11px;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: 999px;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .listen-pill:hover {
        background: rgba(255, 255, 255, 0.13);
      }

      .listen-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(148, 163, 184, 0.6);
      }

      .listen-pill.listening {
        border-color: rgba(248, 113, 113, 0.45);
        background: rgba(239, 68, 68, 0.18);
        color: #fecaca;
      }

      .listen-pill.listening .listen-dot {
        background: #ef4444;
        animation: pulse 1.1s infinite ease-in-out;
      }

      .listen-pill.connecting,
      .listen-pill.reconnecting {
        border-color: rgba(251, 191, 36, 0.45);
        background: rgba(245, 158, 11, 0.16);
        color: #fde68a;
      }

      .listen-pill.connecting .listen-dot,
      .listen-pill.reconnecting .listen-dot {
        background: #f59e0b;
        animation: pulse 0.9s infinite ease-in-out;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 5px;
        -webkit-app-region: no-drag;
      }

      .icon-btn {
        appearance: none;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(244, 246, 250, 0.85);
        font-size: 11px;
        line-height: 1;
        padding: 4px 7px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.12s ease;
      }

      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      .body {
        flex: 1;
        min-height: 0;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        -webkit-app-region: no-drag;
      }

      .error-box {
        display: none;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(239, 68, 68, 0.18);
        border: 1px solid rgba(248, 113, 113, 0.42);
        color: #fecaca;
        font-size: 11.5px;
        line-height: 1.4;
        white-space: pre-wrap;
        user-select: text;
        flex-shrink: 0;
      }

      .error-box.visible {
        display: block;
      }

      .screenshot-bar {
        display: none;
        align-items: center;
        gap: 9px;
        padding: 6px 8px;
        border-radius: 9px;
        background: rgba(56, 189, 248, 0.11);
        border: 1px solid rgba(56, 189, 248, 0.32);
        flex-shrink: 0;
      }

      .screenshot-bar.visible {
        display: flex;
      }

      .screenshot-thumb {
        width: 54px;
        height: 34px;
        object-fit: cover;
        border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(0, 0, 0, 0.35);
        flex-shrink: 0;
      }

      .screenshot-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .screenshot-title {
        font-size: 11.5px;
        font-weight: 600;
        color: #bae6fd;
      }

      .screenshot-meta {
        font-size: 10.5px;
        color: rgba(203, 213, 225, 0.72);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .screenshot-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .section {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }

      .section-suggestion {
        flex: 0 1 auto;
        max-height: 40%;
      }

      .section-transcript {
        flex: 1 1 0;
      }

      .section-label {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.82);
        padding: 6px 10px 4px;
        user-select: none;
        flex-shrink: 0;
      }

      .scroll-area {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 2px 10px 8px;
      }

      .scroll-area::-webkit-scrollbar {
        width: 5px;
      }

      .scroll-area::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 999px;
      }

      .response {
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        color: rgba(248, 250, 252, 0.96);
      }

      .response.empty {
        color: rgba(203, 213, 225, 0.5);
        font-size: 12px;
      }

      .response.streaming::after {
        content: '▍';
        display: inline-block;
        margin-left: 2px;
        color: #60a5fa;
        animation: blink 0.9s steps(1) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .transcript-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
        user-select: text;
      }

      .transcript-empty {
        color: rgba(203, 213, 225, 0.48);
        font-size: 12px;
        line-height: 1.45;
      }

      .transcript-line {
        font-size: 12.5px;
        line-height: 1.4;
        color: rgba(241, 245, 249, 0.94);
        word-break: break-word;
      }

      .transcript-line.source-me {
        color: rgba(224, 242, 254, 0.95);
      }

      .transcript-line.source-them {
        color: rgba(254, 243, 199, 0.95);
      }

      .transcript-line.interim {
        opacity: 0.58;
        font-style: italic;
      }

      .transcript-time {
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
        color: rgba(148, 163, 184, 0.65);
        margin-right: 5px;
        font-style: normal;
      }

      .speaker-tag {
        font-size: 11px;
        font-weight: 600;
        margin-right: 5px;
        font-style: normal;
      }

      .speaker-tag.me {
        color: #38bdf8;
      }

      .speaker-tag.them {
        color: #fbbf24;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 10.5px;
        color: rgba(203, 213, 225, 0.6);
        user-select: none;
        flex-shrink: 0;
        -webkit-app-region: drag;
      }

      .hints {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }

      kbd {
        font-family: inherit;
        background: rgba(255, 255, 255, 0.1);
        padding: 1px 4px;
        border-radius: 4px;
        color: rgba(244, 246, 250, 0.85);
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <header class="header">
        <div class="brand">
          <span id="status-dot" class="status-dot"></span>
          <span>Metatron</span>
          <button
            id="listen-pill"
            class="listen-pill"
            type="button"
            title="Start/Stop Live Transcription (⌘⇧T)"
          >
            <span class="listen-dot"></span>
            <span id="listen-label">Off</span>
          </button>
        </div>
        <div class="header-actions">
          <button id="snap-btn" class="icon-btn" type="button" title="Capture screen (⌘⇧S)">
            Snap
          </button>
          <button id="ask-btn" class="icon-btn" type="button" title="Suggest from transcript (⌘↩)">
            Ask
          </button>
          <button id="hide-btn" class="icon-btn" type="button" title="Hide (⌘⇧Space)">✕</button>
        </div>
      </header>

      <main class="body">
        <div id="error-box" class="error-box" role="alert"></div>

        <div id="screenshot-bar" class="screenshot-bar">
          <img id="screenshot-thumb" class="screenshot-thumb" alt="Attached screen capture" />
          <div class="screenshot-info">
            <div class="screenshot-title">Screenshot attached</div>
            <div id="screenshot-meta" class="screenshot-meta"></div>
          </div>
          <div class="screenshot-actions">
            <button
              id="send-screenshot-btn"
              class="icon-btn"
              type="button"
              title="Send screenshot + transcript (⌘⇧↩)"
            >
              ⌘⇧↩
            </button>
            <button
              id="clear-screenshot-btn"
              class="icon-btn"
              type="button"
              title="Clear screenshot (⌘⇧X)"
            >
              ✕
            </button>
          </div>
        </div>

        <section class="section section-suggestion">
          <div class="section-label">Suggestion</div>
          <div id="response-scroll" class="scroll-area">
            <div id="response" class="response empty">
              ⌘⇧T listen · ⌘↩ ask transcript · ⌘⇧S snap · ⌘⇧↩ ask with screenshot
            </div>
          </div>
        </section>

        <section class="section section-transcript">
          <div class="section-label">Live Transcript (last 3 min)</div>
          <div id="transcript-scroll" class="scroll-area">
            <div id="transcript-list" class="transcript-list">
              <div class="transcript-empty">Not listening yet. Press ⌘⇧T to start.</div>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="hints">
          <span><kbd>⌘⇧T</kbd> Listen</span>
          <span><kbd>⌘⇧S</kbd> Snap</span>
          <span><kbd>⌘↩</kbd> Ask</span>
          <span><kbd>⌘⇧↩</kbd> +Img</span>
          <span><kbd>⌘⇧X</kbd> Clear</span>
        </div>
        <span id="status-text">Ready</span>
      </footer>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
